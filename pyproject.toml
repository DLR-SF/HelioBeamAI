[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heliobeamai"
version = "1.0.0.dev0"
description = "Transformer-based heliostat focal spot and receiver flux prediction from calibration images"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mathias Kuhl", email = "mathias.kuhl@dlr.de" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
# inference only needs torch
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "pytorch-lightning>=2.1",
    "tensorboard>=2.14",
    "PyYAML>=6.0",
]
data = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "tqdm>=4.60",
]
examples = [
    "matplotlib>=3.7",
    "jupyter",
]
experiments = [
    "heliobeamai[train,data]",
    "matplotlib>=3.7",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
heliobeamai = "heliobeamai.cli:main"

[project.urls]
Repository = "https://github.com/DLR-SF/HelioBeamAI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
