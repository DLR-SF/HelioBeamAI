[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "HelioBeamAI"
version = "0.1.0"
authors = [
  { name="Mathias Kuhl", email="mathias.kuhl@dlr.de" },
]
description = "Artificial Intelligence for Heliostat Beam Flux Prediction "
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 1 - Planning",
]
dependencies = [
    # Core
    "torch==2.1.0",
    "torchvision==0.16.0",
    "pytorch-lightning==2.1.2",

    # Scientific computing
    "numpy==1.26.0",
    "scipy==1.11.3",
    "pandas==2.1.2",

    # Visualization
    # "matplotlib==3.8.2",
    # "seaborn==0.13.0",

    # ML Utilities
    # "scikit-learn==1.3.2",
    "tqdm==4.66.1",

    # Image processing
    "opencv-python==4.8.1.78",

    # DL Helpers
    "tensorboard==2.15.0",

    # Optimizers
    "adamp==0.3.0",

    # Tensor manipulation
    "einops==0.6.1",

    # Testing
    "pytest==8.1.1"
]

[project.urls]
Issues = "https://github.com/DLR-SF/UTIS-HeliostatBeamCharacterization/issues"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
